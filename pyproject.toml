[project]
name = "german-learning-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "environs>=15.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

target-version = "py314"

[tool.ruff.format]
quote-style = "double"

skip-magic-trailing-comma = false
