x-app: &app
  image: german-learning-api:local
  build: .
  pull_policy: build
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-german_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/german_learning_api/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bot:
    <<: *app
    command: ["python", "-m", "telegram_bot.main"]

  worker:
    <<: *app
    command: ["celery", "-A", "german_learning_api", "worker", "--loglevel=info"]
    volumes:
      - media_data:/app/german_learning_api/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "german_learning_api", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
